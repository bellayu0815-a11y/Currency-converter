<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bella 的匯率轉換器</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 40px 20px;
      min-height: 100vh;
      background: #f7f3ed;
      color: #343c38;
      font-family: system-ui, sans-serif;
    }
    main {
      max-width: 440px;
      margin: auto;
      padding: 28px;
      background: white;
      border-radius: 24px;
      box-shadow: 0 12px 40px #343c3810;
    }
    h1 { font-size: 26px; margin-bottom: 8px; }
    p { line-height: 1.6; }
    .intro, small { color: #68736c; }
    label { display: block; margin: 22px 0 8px; }
    input, select, button {
      width: 100%;
      padding: 14px;
      border: 1px solid #d7dfd9;
      border-radius: 12px;
      font: inherit;
      font-size: 17px;
    }
    input, select { background: white; color: #343c38; }
    button {
      cursor: pointer;
      margin-top: 18px;
      border: 0;
      background: #426b56;
      color: white;
    }
    button:disabled { opacity: .6; cursor: wait; }
    #swap { background: #edf3ef; color: #426b56; }
    #result {
      margin-top: 24px;
      padding: 20px;
      border-radius: 16px;
      background: #f2f6f3;
      font-size: 26px;
      font-weight: bold;
      overflow-wrap: anywhere;
    }
    #rate, #updated { font-size: 14px; }
    a { color: #426b56; }
  </style>
</head>
<body>
  <main>
    <h1>💱 Bella 的匯率轉換器</h1>
    <p class="intro">輸入金額，輕鬆換算旅行預算。</p>

    <form id="converter">
      <label for="amount">換算金額</label>
      <input id="amount" type="number" inputmode="decimal"
             min="0" step="any" value="1000" required>

      <label for="from">原始幣別</label>
      <select id="from"></select>

      <button id="swap" type="button">⇅ 交換幣別</button>

      <label for="to">換成幣別</label>
      <select id="to"></select>

      <button id="convert" type="submit" disabled>載入匯率中…</button>
    </form>

    <div id="result" role="status" aria-live="polite">正在取得匯率…</div>
    <p id="rate"></p>
    <p id="updated"></p>

    <small>
      參考匯率每日更新；實際換匯金額依銀行報價及手續費而異。
      <br>
      <a href="https://www.exchangerate-api.com"
         target="_blank" rel="noopener">
        Rates By Exchange Rate API
      </a>
    </small>
  </main>

  <script>
    const currencies = {
      TWD: "台幣",
      USD: "美元",
      JPY: "日圓",
      KRW: "韓元",
      HKD: "港幣",
      EUR: "歐元",
      GBP: "英鎊",
      CNY: "人民幣",
      AUD: "澳幣",
      SGD: "新加坡幣"
    };

    const amount = document.getElementById("amount");
    const from = document.getElementById("from");
    const to = document.getElementById("to");
    const result = document.getElementById("result");
    const rate = document.getElementById("rate");
    const updated = document.getElementById("updated");
    const convertButton = document.getElementById("convert");
    let rates = null;

    for (const [code, name] of Object.entries(currencies)) {
      from.add(new Option(`${name} ${code}`, code));
      to.add(new Option(`${name} ${code}`, code));
    }
    from.value = "TWD";
    to.value = "KRW";

    function convert() {
      if (!rates) return;
      rate.textContent = "";

      if (amount.value.trim() === "") {
        result.textContent = "請輸入金額";
        return;
      }

      const value = Number(amount.value);
      if (!Number.isFinite(value) || value < 0) {
        result.textContent = "請輸入大於或等於 0 的有效金額";
        return;
      }

      const exchangeRate = rates[to.value] / rates[from.value];
      const total = value * exchangeRate;
      if (!Number.isFinite(total)) {
        result.textContent = "金額過大，請輸入較小的數值";
        return;
      }

      result.textContent = new Intl.NumberFormat("zh-TW", {
        style: "currency",
        currency: to.value,
        currencyDisplay: "code"
      }).format(total);

      rate.textContent =
        `1 ${from.value} ≈ ${
          exchangeRate.toLocaleString("zh-TW", {
            maximumSignificantDigits: 6
          })
        } ${to.value}`;
    }

    async function loadRates() {
      convertButton.disabled = true;
      convertButton.textContent = "載入匯率中…";
      result.textContent = "正在取得匯率…";
      rate.textContent = "";
      updated.textContent = "";

      const controller = new AbortController();
      const timeout = setTimeout(() => controller.abort(), 12000);

      try {
        const response = await fetch(
          "https://open.er-api.com/v6/latest/USD",
          { signal: controller.signal }
        );
        if (!response.ok) throw new Error("連線失敗");

        const data = await response.json();
        if (data.result !== "success") throw new Error("資料錯誤");

        for (const code of Object.keys(currencies)) {
          if (!Number.isFinite(data.rates?.[code]) ||
              data.rates[code] <= 0) {
            throw new Error("匯率缺漏");
          }
        }

        rates = data.rates;
        updated.textContent = "匯率更新時間：" +
          new Date(data.time_last_update_unix * 1000)
            .toLocaleString("zh-TW", { timeZone: "Asia/Taipei" }) +
          "（台灣時間）";
        convertButton.textContent = "開始換算";
        convert();
      } catch (error) {
        rates = null;
        result.textContent = "無法取得匯率，請確認網路後重試";
        convertButton.textContent = "重新取得匯率";
      } finally {
        clearTimeout(timeout);
        convertButton.disabled = false;
      }
    }

    document.getElementById("converter").addEventListener("submit", event => {
      event.preventDefault();
      if (rates) convert();
      else loadRates();
    });

    document.getElementById("swap").addEventListener("click", () => {
      const previous = from.value;
      from.value = to.value;
      to.value = previous;
      convert();
    });

    amount.addEventListener("input", convert);
    from.addEventListener("change", convert);
    to.addEventListener("change", convert);

    loadRates();
  </script>
</body>
</html>
